services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-black16bot}
      POSTGRES_USER: ${POSTGRES_USER:-black16bot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-black16bot}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-black16bot} -d ${POSTGRES_DB:-black16bot}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate --noinput
      && python manage.py collectstatic --noinput
      && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-black16bot}:${POSTGRES_PASSWORD:-black16bot}@db:5432/${POSTGRES_DB:-black16bot}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "manage.py", "check"]
      interval: 30s
      timeout: 10s
      retries: 3

  bot:
    build: .
    restart: unless-stopped
    command: python manage.py runbot
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-black16bot}:${POSTGRES_PASSWORD:-black16bot}@db:5432/${POSTGRES_DB:-black16bot}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "manage.py", "check"]
      interval: 30s
      timeout: 10s
      retries: 3

  payment_verifier:
    build: .
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate --noinput;
      while true; do
      python manage.py verify_payments --limit 100;
      python manage.py expire_payments;
      sleep 60;
      done"
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-black16bot}:${POSTGRES_PASSWORD:-black16bot}@db:5432/${POSTGRES_DB:-black16bot}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "manage.py", "check"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
